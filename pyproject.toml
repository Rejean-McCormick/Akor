[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akor"
version = "0.1.0"
description = "Akor — Learning in Concert: safe, read-only prequalification for collaborative learning missions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

[project.scripts]
akor = "akor.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
