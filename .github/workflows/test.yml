name: Akor standalone checks

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      # Integration tests require independently provided six sibling repos.
      # They are explicitly skipped if those repos are not present.
